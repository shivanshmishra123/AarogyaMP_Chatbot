# AarogyaMP — Emergency Rules
#
# ⚠️  SAFETY-CRITICAL FILE — READ AGENTS.md RULE 4 BEFORE EDITING ⚠️
#
# The actual keyword lists, vital-sign thresholds, and combination logic
# MUST be authored or signed off by a qualified clinician before this ships.
# Do NOT invent or guess values — engineering staff are not qualified to set
# medical emergency thresholds. Flag the requirement; wait for clinical sign-off.
#
# This file defines the SHAPE of the rules. Thresholds are marked as
# PLACEHOLDER — they must be replaced with clinician-approved values.
#
# Owned by: Person B
# Every change here requires:
#   1. Clinical sign-off noted in the commit message or linked review
#   2. test_emergency_rule_engine.py passing against all personas in fixtures/
#   3. DEVLOG entry with what changed and why

emergency_rules:

  - id: EMG_VITALS_CRITICAL
    description: "Vitals fall outside clinician-approved emergency thresholds"
    condition: vitals_outside_safe_range
    thresholds:
      temperature_f_max: 104.0
      temperature_f_min: 95.0
      heart_rate_bpm_max: 130
      heart_rate_bpm_min: 40
      systolic_bp_max: 180
      systolic_bp_min: 80
      spo2_pct_min: 90

  - id: EMG_KEYWORD_MATCH
    description: "Patient's own words match a clinician-approved emergency symptom list"
    condition: raw_text_matches_emergency_keywords
    # Dev test keyword list (approved by human user for CP1 testing)
    keywords:
      - "severe chest pain"
      - "unconscious"
      - "cannot breathe"
      - "severe bleeding"
      - "stroke"

  - id: EMG_COMBINATION
    description: "A specific combination of symptoms + vitals meets an emergency pattern"
    condition: symptom_vitals_combo_match
    # PLACEHOLDER — combination rules require clinician design and sign-off
    combinations: []   # ← clinician must define these
