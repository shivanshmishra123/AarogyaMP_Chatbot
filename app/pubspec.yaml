name: aarogyamp
description: AarogyaMP — AI-assisted symptom triage, doctor discovery, and doctor-patient consultation platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # HTTP client
  dio: ^5.7.0

  # WebSocket (realtime chat)
  web_socket_channel: ^3.0.1

  # Local persistence
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1         # offline chat cache (optional, wired in M2)

  # Voice input (device-side STT — chosen per Reference §15)
  speech_to_text: ^7.0.0

  # Voice playback (doctor TTS responses)
  flutter_tts: ^4.1.0

  # Voice message recording
  flutter_sound: ^9.2.13

  # Maps & location
  geolocator: ^12.0.0
  google_maps_flutter: ^2.9.0

  # Push notifications (FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # File/image picking (chat attachments)
  image_picker: ^1.1.2
  file_picker: ^10.3.10

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - lib/mocks/mock_assessments.json
    - lib/mocks/mock_doctors.json
